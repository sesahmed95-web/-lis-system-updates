<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>المبلغ المتبقي #{{ visit['registration_number'] }}</title>
<style>@page { size: {{ vb_w }}mm {{ vb_h }}mm; margin: 0; }</style>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Tahoma, Arial, sans-serif; background: #E5E7EB; color: #000; }
  .bar { background: #fff; border-bottom: 1px solid #CBD5E1; padding: 8px 12px; display: flex; gap: 10px; justify-content: center; }
  .bar button { padding: 6px 16px; border-radius: 7px; border: 1px solid #26529C; background: #26529C; color: #fff; font-size: 14px; cursor: pointer; }
  .bar button.sec { background: #fff; color: #26529C; }
  .wrap { display: flex; justify-content: center; padding: 14px; }
  .slip { background: #fff; width: {{ vb_w }}mm; height: {{ vb_h }}mm; padding: 1.2mm 2mm; overflow: hidden;
          display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .pname { font-size: 9pt; font-weight: 800; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
           unicode-bidi: plaintext; text-align: right; }
  .dt { font-size: 6.5pt; direction: ltr; text-align: right; line-height: 1.1; }
  .row { display: flex; justify-content: space-between; align-items: baseline; line-height: 1.15; }
  .row .k { font-size: 7.5pt; font-weight: 700; }
  .row .v { font-size: 9pt; font-weight: 700; direction: ltr; }
  .row.rem .k { font-size: 8.5pt; }
  .row.rem .v { font-size: 12pt; font-weight: 900; }
  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .wrap { padding: 0; display: block; }
    .slip { box-shadow: none; margin: 0; }
  }
</style>
</head>
<body>
<div class="no-print bar">
  <button type="button" onclick="window.print()">🖨️ طباعة</button>
  <button type="button" class="sec" onclick="window.close()">إغلاق</button>
</div>
<div class="wrap">
  <div class="slip">
    <div class="pname">{{ visit['full_name'] }}</div>
    <div class="dt">{{ printed_at }}</div>
    <div class="row rem"><span class="k">المتبقي</span><span class="v">{{ '{:,.0f}'.format(bal['remaining']) }}</span></div>
    <div class="row"><span class="k">الواصل</span><span class="v">{{ '{:,.0f}'.format(bal['paid']) }}</span></div>
  </div>
</div>
<script>
  if (new URLSearchParams(location.search).get('auto') === '1') {
    window.addEventListener('load', function () { setTimeout(function () { window.print(); }, 200); });
    window.addEventListener('afterprint', function () { if (window.opener) setTimeout(function () { window.close(); }, 300); });
  }
</script>
</body>
</html>
