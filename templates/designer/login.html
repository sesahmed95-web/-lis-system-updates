<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول المصمم</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card-wide" style="grid-template-columns: 1fr;">
    <div class="login-form-side">
      <h1 class="login-title">🔧 دخول المصمم</h1>
      {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
      <form method="POST">
        <div class="form-field">
          <input type="text" name="username" placeholder="اسم مستخدم المصمم" required autofocus>
        </div>
        <div class="form-field">
          <input type="password" name="password" placeholder="كلمة مرور المصمم" required>
        </div>
        <button class="btn login-submit" type="submit">دخول</button>
      </form>
      <div class="demo-users">
        <a href="{{ url_for('login') }}">↩ رجوع لتسجيل الدخول العادي</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
