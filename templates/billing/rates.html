{% extends "base.html" %}
{% block page_title %}{{ t('rates') }}{% endblock %}
{% block content %}
<div class="card">
  <table>
    <thead><tr><th>{{ t('test') }}</th><th>{{ t('department') }}</th><th>{{ t('price') }}</th><th></th></tr></thead>
    <tbody>
      {% for test in tests %}
      <tr>
        <td>{{ test['name'] }}</td>
        <td>{{ test['department'] }}</td>
        <td>
          <form method="POST" style="display:flex; gap:6px;">
            <input type="hidden" name="test_id" value="{{ test['id'] }}">
            <input type="number" step="0.01" name="price" value="{{ test['price'] }}" style="width:110px">
            <button class="btn small" type="submit">{{ t('update_price') }}</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
